[project]
name = "atividade-fatecie-introducao-dados"
version = "0.1.0"
description = "APA - Introdução à Ciência de Dados (Fatecie): exercícios com numpy, pandas e matplotlib em Jupyter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Bibliotecas usadas nos exercícios
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    # Jupyter para rodar o notebook localmente (navegador ou linha de comando)
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[tool.uv]
# Projeto de notebooks, não é um pacote instalável.
package = false
